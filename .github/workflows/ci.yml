name: CI

# Frontend Selenium/integration tests are not yet included because no Selenium
# test infrastructure exists in this repository. They are tracked in issue #10
# and will be added in a dedicated CI job once that work is complete.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
  
    selenium-e2e-tests:
      name: Frontend Selenium E2E tests
      runs-on: ubuntu-latest
      needs: test

      steps:
        - uses: actions/checkout@v4

        - name: Start application with Docker Compose
          run: |
            docker compose up -d --build
            sleep 30

        - name: Check running containers
          run: docker compose ps

        - name: Set up Node.js for Selenium tests
          uses: actions/setup-node@v4
          with:
            node-version: "20"
            cache: "npm"
            cache-dependency-path: frontend-test/package-lock.json

        - name: Install Selenium test dependencies
          working-directory: frontend-test
          run: npm ci

        - name: Run Selenium E2E tests
          working-directory: frontend-test
          env:
            BASE_URL: http://localhost:8080
            E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
            E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
          run: npm test

        - name: Show Docker logs if tests fail
          if: failure()
          run: docker compose logs

        - name: Stop Docker Compose
          if: always()
          run: docker compose down

  build-backend:
    name: Build backend Docker image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/backend/Dockerfile
          push: false
          tags: bookrunner-backend:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

  build-frontend:
    name: Build frontend Docker image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/frontend/Dockerfile
          push: false
          tags: bookrunner-frontend:ci
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max
