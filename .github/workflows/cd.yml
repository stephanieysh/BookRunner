name: CD

on:
  push:
    branches:
      - main
    tags:
      - "v*"

# Prevent concurrent deployments to the same environment.
# A newer run on the same ref cancels any still-running older run.
concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: true

env:
  ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}
  BACKEND_IMAGE: ${{ secrets.ACR_LOGIN_SERVER }}/bookrunner-backend
  FRONTEND_IMAGE: ${{ secrets.ACR_LOGIN_SERVER }}/bookrunner-frontend

jobs:
  test:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  build-and-push:
    name: Build & push images to ACR
    runs-on: ubuntu-latest
    needs: test
    outputs:
      image-tag: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Derive image tag
        id: meta
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          else
            VERSION="main-${GITHUB_SHA::8}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Inject frontend API URL
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            API_URL=$(az containerapp show \
              --name ${{ secrets.ACA_PRODUCTION_BACKEND_APP }} \
              --resource-group ${{ secrets.ACA_RESOURCE_GROUP }} \
              --query "properties.configuration.ingress.fqdn" \
              --output tsv)
            API_URL="https://${API_URL}"
          else
            API_URL=$(az containerapp show \
              --name ${{ secrets.ACA_STAGING_BACKEND_APP }} \
              --resource-group ${{ secrets.ACA_RESOURCE_GROUP }} \
              --query "properties.configuration.ingress.fqdn" \
              --output tsv)
            API_URL="https://${API_URL}"
          fi

          echo "Using API URL: $API_URL"

          sed -i "s|cfg.API_BASE_URL = .*;|cfg.API_BASE_URL = \"$API_URL\";|g" js/config.js

      - name: Verify config.js after injection
        run: |
          cat js/config.js

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/backend/Dockerfile
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ steps.meta.outputs.version }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/frontend/Dockerfile
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ steps.meta.outputs.version }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

  deploy-staging:
    name: Deploy to staging
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    environment: staging
    steps:
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Record deploy start time
        id: deploy_start
        run: echo "timestamp=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Verify staging backend Container App exists
        env:
          ACA_APP: ${{ secrets.ACA_STAGING_BACKEND_APP }}
          ACA_RG: ${{ secrets.ACA_RESOURCE_GROUP }}
        run: |
          az containerapp show \
            --name "$ACA_APP" \
            --resource-group "$ACA_RG" \
            --only-show-errors

      - name: Deploy backend to staging Container App
        env:
          ACA_APP: ${{ secrets.ACA_STAGING_BACKEND_APP }}
          ACA_RG: ${{ secrets.ACA_RESOURCE_GROUP }}
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          JWT_SECRET: ${{ secrets.STAGING_JWT_SECRET }}
          FRONTEND_ORIGIN: ${{ secrets.STAGING_FRONTEND_ORIGIN }}
        run: |
          az containerapp update \
            --name "$ACA_APP" \
            --resource-group "$ACA_RG" \
            --image "$BACKEND_IMAGE:${{ needs.build-and-push.outputs.image-tag }}" \
            --set-env-vars DATABASE_URL="$DATABASE_URL" JWT_SECRET="$JWT_SECRET" FRONTEND_ORIGIN="$FRONTEND_ORIGIN"

      - name: Wait for staging backend to be running
        env:
          ACA_APP: ${{ secrets.ACA_STAGING_BACKEND_APP }}
          ACA_RG: ${{ secrets.ACA_RESOURCE_GROUP }}
        run: |
          echo "Waiting for Container App to reach Running state..."
          for i in $(seq 1 30); do
            STATE=$(az containerapp show \
              --name "$ACA_APP" \
              --resource-group "$ACA_RG" \
              --query "properties.runningStatus" \
              --output tsv 2>/dev/null || echo "unknown")
            echo "  Attempt $i: runningStatus=$STATE"
            if [[ "$STATE" == "Running" ]]; then
              echo "Container App is Running."
              break
            fi
            sleep 10
          done
          if [[ "$STATE" != "Running" ]]; then
            echo "::warning::Container App did not reach Running state within 5 minutes."
          fi

      - name: Get staging backend URL
        env:
          ACA_APP: ${{ secrets.ACA_STAGING_BACKEND_APP }}
          ACA_RG: ${{ secrets.ACA_RESOURCE_GROUP }}
        run: |
          FQDN=$(az containerapp show \
            --name "$ACA_APP" \
            --resource-group "$ACA_RG" \
            --query "properties.configuration.ingress.fqdn" \
            --output tsv)
          if [[ -z "${FQDN}" ]]; then
            echo "::error::Could not retrieve the staging backend FQDN. Ensure the backend Container App is deployed and has ingress enabled."
            exit 1
          fi
          echo "STAGING_BACKEND_URL=https://${FQDN}" >> "$GITHUB_ENV"

      - name: Record deploy duration
        id: deploy_end
        env:
          ACA_APP: ${{ secrets.ACA_STAGING_BACKEND_APP }}
          ACA_RG: ${{ secrets.ACA_RESOURCE_GROUP }}
        run: |
          END=$(date +%s)
          START=${{ steps.deploy_start.outputs.timestamp }}
          DURATION=$((END - START))
          echo "deploy_duration=${DURATION}" >> "$GITHUB_OUTPUT"
          echo "Deploy duration: ${DURATION}s (target: ≤300s)"
          if [[ $DURATION -le 300 ]]; then
            echo "Result: PASS"
          else
            echo "Result: FAIL (exceeded 5-minute target)"
          fi

      - name: Write deploy metrics
        env:
          ACA_APP: ${{ secrets.ACA_STAGING_BACKEND_APP }}
        run: |
          PASSED=$( [[ ${{ steps.deploy_end.outputs.deploy_duration }} -le 300 ]] && echo "true" || echo "false" )
          echo "{\"deploy_duration_seconds\":${{ steps.deploy_end.outputs.deploy_duration }},\"target_seconds\":300,\"passed\":${PASSED},\"commit\":\"${{ github.sha }}\",\"image_tag\":\"${{ needs.build-and-push.outputs.image-tag }}\",\"app_name\":\"${{ env.ACA_APP }}\",\"environment\":\"staging\",\"timestamp\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}" > deploy-metrics.json

      - name: Upload deploy metrics artifact
        uses: actions/upload-artifact@v4
        with:
          name: deploy-metrics-staging
          path: deploy-metrics.json
          retention-days: 30

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Debug config path
        run: |
          pwd
          ls -la
          find . -name "config.js"

      - name: Inject staging frontend API URL
        run: |
          sed -i "s|cfg.API_BASE_URL = cfg.API_BASE_URL ?? \"\";|cfg.API_BASE_URL = \"${{ env.STAGING_BACKEND_URL }}\";|g" js/config.js

      - name: Deploy frontend to staging Container App
        uses: azure/container-apps-deploy-action@v2
        with:
          resourceGroup: ${{ secrets.ACA_RESOURCE_GROUP }}
          containerAppName: ${{ secrets.ACA_STAGING_FRONTEND_APP }}
          imageToDeploy: ${{ env.FRONTEND_IMAGE }}:${{ needs.build-and-push.outputs.image-tag }}
          environmentVariables: BACKEND_URL=${{ env.STAGING_BACKEND_URL }}

  perf-test:
    name: Performance tests
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get staging backend URL
        id: backend_url
        env:
          ACA_APP: ${{ secrets.ACA_STAGING_BACKEND_APP }}
          ACA_RG: ${{ secrets.ACA_RESOURCE_GROUP }}
        run: |
          FQDN=$(az containerapp show \
            --name "$ACA_APP" \
            --resource-group "$ACA_RG" \
            --query "properties.configuration.ingress.fqdn" \
            --output tsv)
          echo "url=https://${FQDN}" >> "$GITHUB_OUTPUT"

      - name: Set staging rate limits for load testing
        env:
          ACA_APP: ${{ secrets.ACA_STAGING_BACKEND_APP }}
          ACA_RG: ${{ secrets.ACA_RESOURCE_GROUP }}
        run: |
          az containerapp update \
            --name "$ACA_APP" \
            --resource-group "$ACA_RG" \
            --set-env-vars \
              RATE_LIMIT_AUTH_MAX=5000 \
              RATE_LIMIT_BOOKS_MAX=5000 \
              RATE_LIMIT_CART_MAX=5000 \
              RATE_LIMIT_PROFILE_MAX=5000

      - name: Wait for rate limit changes to take effect
        run: sleep 15

      - name: Verify backend is healthy
        run: |
          for i in $(seq 1 10); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${{ steps.backend_url.outputs.url }}/health")
            if [ "$STATUS" = "200" ]; then
              echo "Backend healthy."
              break
            fi
            echo "Attempt $i: status=$STATUS, retrying..."
            sleep 5
          done

      - name: Install k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg \
            --keyserver hkp://keyserver.ubuntu.com:80 \
            --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" \
            | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update && sudo apt-get install -y k6

      - name: Run k6 ramping VUs test
        run: |
          mkdir -p results
          BASE_URL=${{ steps.backend_url.outputs.url }} SCENARIO=ramping \
            k6 run \
              --summary-export=results/ramping-summary.json \
              performance-test/load-test.js || true

      - name: Run k6 throughput test
        run: |
          BASE_URL=${{ steps.backend_url.outputs.url }} SCENARIO=throughput \
            k6 run \
              --summary-export=results/throughput-summary.json \
              performance-test/load-test.js || true

      - name: Print k6 results summary
        if: always()
        run: |
          echo "============================================"
          echo " Performance Test Results"
          echo "============================================"
          for f in results/ramping-summary.json results/throughput-summary.json; do
            if [ -f "$f" ]; then
              TEST_NAME=$(basename "$f" .json | sed 's/-summary//')
              echo ""
              echo "--- $TEST_NAME ---"
              echo "  Avg response time: $(node -e "const d=require('./$f'); console.log(d.metrics.http_req_duration.values.avg.toFixed(2)+'ms')" 2>/dev/null || echo 'N/A')"
              echo "  P95 response time: $(node -e "const d=require('./$f'); console.log(d.metrics.http_req_duration.values['p(95)'].toFixed(2)+'ms')" 2>/dev/null || echo 'N/A')"
              echo "  Request rate:      $(node -e "const d=require('./$f'); console.log(d.metrics.http_reqs.values.rate.toFixed(2)+' req/s')" 2>/dev/null || echo 'N/A')"
              echo "  Max VUs:           $(node -e "const d=require('./$f'); console.log(d.metrics.vus_max.values.max)" 2>/dev/null || echo 'N/A')"
            fi
          done
          echo ""
          echo "============================================"

      - name: Reset staging rate limits
        if: always()
        env:
          ACA_APP: ${{ secrets.ACA_STAGING_BACKEND_APP }}
          ACA_RG: ${{ secrets.ACA_RESOURCE_GROUP }}
        run: |
          az containerapp update \
            --name "$ACA_APP" \
            --resource-group "$ACA_RG" \
            --set-env-vars \
              RATE_LIMIT_AUTH_MAX=20 \
              RATE_LIMIT_BOOKS_MAX=200 \
              RATE_LIMIT_CART_MAX=100 \
              RATE_LIMIT_PROFILE_MAX=100

      - name: Upload performance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-evidence
          path: results/
          retention-days: 90

  deploy-production:
    name: Deploy to production
    runs-on: ubuntu-latest
    needs: build-and-push
    if: startsWith(github.ref, 'refs/tags/v')
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tag is reachable from main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tagged commit is not reachable from main. Merge to main and deploy to staging before tagging a production release."
            exit 1
          fi

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Record deploy start time
        id: deploy_start
        run: echo "timestamp=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Deploy backend to production Container App
        uses: azure/container-apps-deploy-action@v2
        with:
          resourceGroup: ${{ secrets.ACA_RESOURCE_GROUP }}
          containerAppName: ${{ secrets.ACA_PRODUCTION_BACKEND_APP }}
          imageToDeploy: ${{ env.BACKEND_IMAGE }}:${{ needs.build-and-push.outputs.image-tag }}
          environmentVariables: DATABASE_URL=${{ secrets.PRODUCTION_DATABASE_URL }} JWT_SECRET=${{ secrets.PRODUCTION_JWT_SECRET }} FRONTEND_ORIGIN=${{ secrets.PRODUCTION_FRONTEND_ORIGIN }}

      - name: Wait for production backend to be running
        env:
          ACA_APP: ${{ secrets.ACA_PRODUCTION_BACKEND_APP }}
          ACA_RG: ${{ secrets.ACA_RESOURCE_GROUP }}
        run: |
          echo "Waiting for Container App to reach Running state..."
          for i in $(seq 1 30); do
            STATE=$(az containerapp show \
              --name "$ACA_APP" \
              --resource-group "$ACA_RG" \
              --query "properties.runningStatus" \
              --output tsv 2>/dev/null || echo "unknown")
            echo "  Attempt $i: runningStatus=$STATE"
            if [[ "$STATE" == "Running" ]]; then
              echo "Container App is Running."
              break
            fi
            sleep 10
          done
          if [[ "$STATE" != "Running" ]]; then
            echo "::warning::Container App did not reach Running state within 5 minutes."
          fi

      - name: Record deploy duration
        id: deploy_end
        env:
          ACA_APP: ${{ secrets.ACA_PRODUCTION_BACKEND_APP }}
        run: |
          END=$(date +%s)
          START=${{ steps.deploy_start.outputs.timestamp }}
          DURATION=$((END - START))
          echo "deploy_duration=${DURATION}" >> "$GITHUB_OUTPUT"
          echo "Deploy duration: ${DURATION}s (target: ≤300s)"
          if [[ $DURATION -le 300 ]]; then
            echo "Result: PASS"
          else
            echo "Result: FAIL (exceeded 5-minute target)"
          fi

      - name: Write deploy metrics
        env:
          ACA_APP: ${{ secrets.ACA_PRODUCTION_BACKEND_APP }}
        run: |
          PASSED=$( [[ ${{ steps.deploy_end.outputs.deploy_duration }} -le 300 ]] && echo "true" || echo "false" )
          echo "{\"deploy_duration_seconds\":${{ steps.deploy_end.outputs.deploy_duration }},\"target_seconds\":300,\"passed\":${PASSED},\"commit\":\"${{ github.sha }}\",\"image_tag\":\"${{ needs.build-and-push.outputs.image-tag }}\",\"app_name\":\"${{ env.ACA_APP }}\",\"environment\":\"production\",\"timestamp\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}" > deploy-metrics.json

      - name: Upload deploy metrics artifact
        uses: actions/upload-artifact@v4
        with:
          name: deploy-metrics-production
          path: deploy-metrics.json
          retention-days: 30

      - name: Get production backend URL
        run: |
          FQDN=$(az containerapp show \
            --name ${{ secrets.ACA_PRODUCTION_BACKEND_APP }} \
            --resource-group ${{ secrets.ACA_RESOURCE_GROUP }} \
            --query "properties.configuration.ingress.fqdn" \
            --output tsv)
          if [[ -z "${FQDN}" ]]; then
            echo "::error::Could not retrieve the production backend FQDN. Ensure the backend Container App is deployed and has ingress enabled."
            exit 1
          fi
          echo "PRODUCTION_BACKEND_URL=https://${FQDN}" >> "$GITHUB_ENV"

      - name: Deploy frontend to production Container App
        uses: azure/container-apps-deploy-action@v2
        with:
          resourceGroup: ${{ secrets.ACA_RESOURCE_GROUP }}
          containerAppName: ${{ secrets.ACA_PRODUCTION_FRONTEND_APP }}
          imageToDeploy: ${{ env.FRONTEND_IMAGE }}:${{ needs.build-and-push.outputs.image-tag }}
          environmentVariables: BACKEND_URL=${{ env.PRODUCTION_BACKEND_URL }}
